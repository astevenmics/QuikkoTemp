# Convenience bundle for Redis-backed matching: sets queue-store=redis
# together with the connection env vars. Activate with
# SPRING_PROFILES_ACTIVE=redis (can be combined with "postgres").
#
# Note: quikko.matching.queue-store=redis is the only property that
# actually matters (see RedisConfig) — setting it directly, without this
# profile, works too, as long as spring.data.redis.* points at a real
# Redis.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

quikko.matching.queue-store=redis
