# Local development convenience overrides.
# Activate with SPRING_PROFILES_ACTIVE=dev
#
# NOTE: spring.h2.console.enabled currently has no effect on this project's
# Spring Boot version (4.1.0) -- H2ConsoleAutoConfiguration was removed from
# spring-boot-autoconfigure entirely (verified: it is not present in the
# 4.1.0 jar's autoconfiguration list), so there is no web console to enable
# or disable anymore. Left set here in case a future Boot version
# reintroduces it; harmless either way since in-memory H2 (jdbc:h2:mem:)
# can only ever be reached from within the same JVM regardless.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
