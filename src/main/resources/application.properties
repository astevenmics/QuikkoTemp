server.port=${PORT:8080}

spring.application.name=quikko

# Local dev default: in-memory H2 database (no Postgres required).
spring.datasource.url=jdbc:h2:mem:quikko;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------------
# Quikko application settings
# ---------------------------------------------------------------------------

# how long a user waits for an interest-overlap match before falling back
# to matching with anyone available in the queue
quikko.matching.fallback-after-seconds=7
# how often the matchmaking scheduler scans the queue
quikko.matching.poll-interval-ms=1000

# number of reports against a session before its IP is temporarily banned
quikko.moderation.report-ban-threshold=5
quikko.moderation.ban-duration-minutes=60
# simple configurable profanity list, comma separated, case-insensitive
quikko.moderation.profanity-words=fuck,shit,bitch,asshole,cunt,nigger,faggot

quikko.rate-limit.max-joins-per-window=10
quikko.rate-limit.window-seconds=60

quikko.webrtc.stun-urls=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
quikko.webrtc.turn-url=${TURN_URL:}
quikko.webrtc.turn-username=${TURN_USERNAME:}
quikko.webrtc.turn-credential=${TURN_CREDENTIAL:}

quikko.interests.suggested=Music,Movies,Gaming,Sports,Books,Travel,Technology,Art,Food,Anime,Fitness,Science,Photography,Fashion,Nature,Comedy,Cars,Cooking,Pets,Politics

quikko.capsule.unlock-after-days=7
quikko.capsule.max-length=280
# cron for the daily unlock-check job (default: 03:00 every day)
quikko.capsule.unlock-check-cron=0 0 3 * * *

logging.level.com.quikko=INFO
