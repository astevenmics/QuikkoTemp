# Real PostgreSQL persistence for Time Capsules.
# Activate with SPRING_PROFILES_ACTIVE=postgres (can be combined with "redis").
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quikko}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:quikko}
spring.datasource.password=${DB_PASSWORD:quikko}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
