# Real MySQL persistence for Time Capsules.
# Activate with SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quikko}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:quikko}
spring.datasource.password=${DB_PASSWORD:quikko}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# The H2 console (enabled by default for local dev, see application.properties)
# is a browser-based SQL client that binds to whatever DataSource is
# configured — leaving it reachable against a real production database would
# let anyone who can hit the endpoint run arbitrary SQL. Force it off here.
spring.h2.console.enabled=false
