# Real MySQL persistence for Time Capsules.
# Activate with SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quikko}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# No fallback values here on purpose — a guessable default credential
# ("quikko"/"quikko") would otherwise let the app start and silently
# connect with it in any mysql-profile deployment that forgot to set
# these. Missing either env var now fails startup instead.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# The H2 console (enabled by default for local dev, see application.properties)
# is a browser-based SQL client that binds to whatever DataSource is
# configured — leaving it reachable against a real production database would
# let anyone who can hit the endpoint run arbitrary SQL. Force it off here.
spring.h2.console.enabled=false
